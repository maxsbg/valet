# Baut die Web-App auf main und aktualisiert den bestehenden gh-pages-Branch.
# Der separate Vorschau-Ordner bleibt bei Live-Veröffentlichungen erhalten.
name: Web-App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @valet/app build:web
      - name: Veröffentlichungs-Branch laden
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Live-App aktualisieren und Vorschau behalten
        if: github.ref == 'refs/heads/main'
        run: |
          PAGES_DIR="$GITHUB_WORKSPACE/pages"
          test "$(git -C "$PAGES_DIR" rev-parse --show-toplevel)" = "$PAGES_DIR"
          test -f "$GITHUB_WORKSPACE/apps/app/dist/index.html"
          rsync -a --delete --exclude='/preview/' "$GITHUB_WORKSPACE/apps/app/dist/" "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" add -A
          if ! git -C "$PAGES_DIR" diff --cached --quiet; then
            git -C "$PAGES_DIR" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Web-App ${GITHUB_SHA::7}"
            git -C "$PAGES_DIR" push --force origin HEAD:gh-pages
          fi
