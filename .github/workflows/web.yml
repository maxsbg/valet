# Baut die Web-App auf main und aktualisiert den bestehenden gh-pages-Branch.
# Der separate Vorschau-Ordner bleibt bei Live-Veröffentlichungen erhalten.
name: Web-App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @valet/app build:web
      - name: Veröffentlichungs-Branch laden
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Live-App aktualisieren und Vorschau behalten
        if: github.ref == 'refs/heads/main'
        run: |
          rsync -a --delete --exclude='/preview/' apps/app/dist/ pages/
          touch pages/.nojekyll
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Web-App ${GITHUB_SHA::7}"
            git -C pages push --force origin HEAD:gh-pages
          fi
