name: Vorschau auf GitHub Pages
on:
  push:
    branches: [refactor/simple-piece-lists]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - name: Web-App für Vorschau bauen
        run: pnpm --filter @valet/app build:web
        env:
          VALET_BASE_URL: /valet/preview
      - name: Veröffentlichungs-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Vorschau aktualisieren
        run: |
          mkdir -p pages/preview
          rsync -a --delete apps/app/dist/ pages/preview/
          touch pages/.nojekyll
          git -C pages add -A preview .nojekyll
          if ! git -C pages diff --cached --quiet; then
            git -C pages -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Vorschau \${GITHUB_SHA::7}"
            git -C pages push origin gh-pages
          fi
