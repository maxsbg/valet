# Spielt den Freistell-Server ein: auf Modal (Grafikkarte, schnell, begrenztes Guthaben)
# und in einen Hugging Face Space (Prozessor, ohne Kontingent, Ersatz).
# Secrets: MODAL_TOKEN_ID + MODAL_TOKEN_SECRET bzw. HF_TOKEN (Typ Write). Fehlt eines, wird der Teil übersprungen.
name: Freistell-Server einspielen
on:
  push:
    branches: [main, freistellen]
    paths: ['services/freistellen/**', '.github/workflows/freistellen.yml']
  workflow_dispatch:
concurrency:
  group: freistellen
  cancel-in-progress: false
jobs:
  modal:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Auf Modal einspielen
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then echo "::notice::Modal-Secrets fehlen – übersprungen"; exit 0; fi
          pip install -q modal==1.6.4
          modal deploy services/freistellen/modal_app.py
  space:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: In den Hugging Face Space einspielen
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::notice::HF_TOKEN fehlt – übersprungen"; exit 0; fi
          pip install -q huggingface_hub==2.4.0
          mkdir up && cp services/freistellen/{Dockerfile,requirements.txt,server.py} up/ && cp services/freistellen/space/README.md up/
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = api.whoami()['name'] + '/valet-freistellen'
          api.create_repo(repo, repo_type='space', space_sdk='docker', exist_ok=True)
          api.upload_folder(folder_path='up', repo_id=repo, repo_type='space', commit_message='Freistell-Server aktualisieren')
          print('Space:', 'https://huggingface.co/spaces/' + repo)
          PY
