<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valet – Wunschliste: Kachel-Plaketten</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<style>
:root{--font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;--font-display:"Gloock",Georgia,serif}
.dark{--bg:#17110F;--surface:#221A18;--ink:#F5F0E8;--muted:#A8999A;--hair:#F5F0E824;--accent:#E8899F;--glass:#221A18B8;--glassB:#F5F0E81F;--me:#EF91B0}
.light{--bg:#F5F0E8;--surface:#FFFCF7;--ink:#2A1A1D;--muted:#6E5E60;--hair:#2A1A1D1F;--accent:#722638;--glass:#F5F0E8B8;--glassB:#FFFFFF8C;--me:#D9668E}
body{margin:0;background:#0d0a09;font-family:var(--font-text);-webkit-font-smoothing:antialiased;color:#F5F0E8}
.ctl{max-width:393px;margin:0 auto;padding:12px 16px 4px;display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:#2C2321;border-radius:9px;padding:2px;font-size:13px}
.seg button{all:unset;padding:6px 10px;border-radius:7px;color:#A8999A;cursor:pointer}
.seg button.on{background:#F5F0E8;color:#2A1A1D;font-weight:600}
.phone{position:relative;width:393px;max-width:100vw;height:852px;margin:8px auto 24px;background:var(--bg);color:var(--ink);overflow:hidden;border-radius:44px}
@media(max-width:430px){.phone{border-radius:0;margin-top:8px}}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:54px 16px 160px;box-sizing:border-box}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:0 -8px 10px}
.mono{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 22px/1 var(--font-display);color:var(--me);border:1px solid color-mix(in srgb,var(--me) 45%,transparent);background:color-mix(in srgb,var(--me) 12%,transparent)}
.word{font:400 30px/32px var(--font-display);color:var(--accent)}
.rb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--glassB)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:12px}
.card .s{font-size:13px;color:var(--muted)}
.card .n{font:400 28px/34px var(--font-display)}
.mosaic{display:flex;gap:10px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
.tabbar{position:absolute;left:21px;right:21px;bottom:34px;height:58px;border-radius:999px;background:var(--glass);border:1px solid var(--glassB);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);display:flex;align-items:center;padding:0 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--accent);font-weight:600}
.tab svg,.rb svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:absolute;right:21px;bottom:108px;width:56px;height:56px;border-radius:50%;background:var(--glass);border:1px solid var(--glassB);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* Kachel (aus valet-kachel-referenz.html) */
.v-tile{position:relative;background:#fff;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 22px 3px var(--glow,rgba(216,210,200,0.28))}
.v-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(42,26,29,.09);pointer-events:none}
.v-tile__img{display:block;width:100%;object-fit:contain;padding:10px;box-sizing:border-box;mix-blend-mode:multiply}
.v-badge{position:relative;width:20px;height:20px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#2A1A1D;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px) saturate(1.8);backdrop-filter:blur(10px) saturate(1.8);box-shadow:inset 0 .5px 0 #fff,inset 0 0 0 .5px rgba(255,255,255,.7),0 0 0 .5px rgba(42,26,29,.10),0 2px 6px rgba(42,26,29,.12)}
.v-badge>svg.i{display:block;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.v-badge--pill{width:auto;padding:0 6px}
.v-badge--pill svg.i{width:10px;height:10px;margin-right:2px}
.num{display:block;font:700 8.5px/1 var(--font-text);letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;text-box:trim-both cap alphabetic}
.price{display:block;font:700 8.5px/1 var(--font-text);letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap;text-box:trim-both cap alphabetic}
.eur{font-size:6.5px;font-weight:600;vertical-align:.12em;margin-left:.5px;margin-right:-.4px}
.v-badge--price{width:auto;min-width:20px;padding:0 5px;box-sizing:border-box}
.mono-b{display:block;font:400 11px/1 var(--font-display);text-box:trim-both cap alphabetic}
.ring{position:absolute;inset:0}
.ring circle{fill:none;stroke-width:1.4}
.v-slot{position:absolute}
.tl{top:4px;left:4px}.tr{top:4px;right:4px}.bl{bottom:4px;left:4px}.br{bottom:4px;right:4px}
.due{background:rgba(249,229,138,.92);color:#5C4A0A}
.leg{max-width:393px;margin:0 auto 40px;padding:0 16px;box-sizing:border-box}
.lh{font-size:13px;color:#A8999A;margin:18px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border-radius:14px;box-shadow:inset 0 0 22px 3px rgba(216,210,200,.28);padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px}
.chip .z{transform:scale(1.6);transform-origin:center;margin:6px 0}
.chip span.l{font-size:11px;color:#6E5E60}
</style>
</head>

function hsv([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return{s:mx===0?0:(mx-mn)/mx,v:mx}}

 someday:'<path d="M15.5 3.5l1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5z"/><path d="M9.5 13.5l-6 6"/><path d="M12.5 16.5l-3 3"/><path d="M7 11l-3 3"/>',
 gift:'<path d="M4 9.5h16v3H4z"/><path d="M5.5 12.5V20h13v-7.5"/><path d="M12 9.5V20"/><path d="M12 9.5C10.5 6 7 5.5 7 7.5S10 9.5 12 9.5c2 0 5 0 5-2s-3.5-1.5-5 2"/>',
 hour:'<path d="M6.5 3.5h11"/><path d="M6.5 20.5h11"/><path d="M8 3.5v2.2a4 4 0 0 0 1.6 3.2L12 12l2.4-3.1A4 4 0 0 0 16 5.7V3.5"/><path d="M8 20.5v-2.2a4 4 0 0 1 1.6-3.2L12 12l2.4 3.1a4 4 0 0 1 1.6 3.2v2.2"/>',
 q:'<path d="M9 9a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.9v.6"/><path d="M12 18h.01"/>'
};
const ic=(k)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
let V='A',H=true;
function waitBadge(d){
  if(d<=0) return `<div class="v-badge due" aria-label="Bedenkzeit vorbei">${ic('q')}</div>`;
  const warn=d<=3, col=warn?'#FF641F':'#722638';
  if(V==='B') return `<div class="v-badge v-badge--pill" aria-label="noch ${d} Tage" style="color:${warn?'#B8430F':'#2A1A1D'}">${ic('hour')}<span class="num">${d}</span></div>`;
  const r=7.5,Cc=2*Math.PI*r,p=d/14;
  return `<div class="v-badge" aria-label="noch ${d} Tage"><svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="${r}" stroke="rgba(42,26,29,.10)"/><circle cx="10" cy="10" r="${r}" stroke="${col}" stroke-linecap="round" stroke-dasharray="${(Cc*p).toFixed(2)} ${Cc.toFixed(2)}" transform="rotate(-90 10 10)"/></svg><span class="num" style="position:relative${d>9?";font-size:7.5px;letter-spacing:-.4px;margin-right:.5px;transform:translateY(-.2px)":""}">${d}</span></div>`;
}
const fmt=n=>n.toLocaleString('de-DE');
const priceBadge=n=>`<div class="v-badge v-badge--price" aria-label="${fmt(n)} Euro"><span class="price">${fmt(n)}<span class="eur">€</span></span></div>`;
function tile(t,w){
  const h=Math.round(w*RATIO[t.img]);
  let s=`<div class="v-tile" style="--glow:${glowFor(C[t.img].main,C[t.img].hl)}"><img class="v-tile__img" src="${IMG[t.img]}" alt="" style="height:${h}px">`;
  if(H&&t.hint) s+=`<div class="v-slot tl"><div class="v-badge">${ic(t.hint)}</div></div>`;
  s+=`<div class="v-slot tr">${waitBadge(t.days)}</div>`;
  s+=`<div class="v-slot bl">${priceBadge(t.price)}</div>`;
  s+=`<div class="v-slot br"><div class="v-badge"><span class="mono-b" style="color:${PEOPLE[t.owner].text}">${t.owner}</span></div></div>`;
  return s+'</div>';
}
const wishes=[
 {img:'sneaker',price:129,days:11,owner:'M',hint:'next'},
 {img:'jacket',price:1249,days:2,owner:'M',hint:'grail'},
 {img:'tank',price:35,days:7,owner:'P',hint:'gift'},
 {img:'pants',price:89,days:13,owner:'M',hint:'watch'},
 {img:'loafer',price:159,days:0,owner:'M'},
 {img:'cap',price:9,days:5,owner:'P',hint:'someday'},
];
function render(){
  const W=document.querySelector('.mosaic').clientWidth, w=(W-20)/3, cols=[[],[],[]], hs=[0,0,0];
  for(const t of wishes){const i=hs.indexOf(Math.min(...hs));cols[i].push(t);hs[i]+=w*RATIO[t.img]+10}
  document.getElementById('mosaic').innerHTML=cols.map(c=>`<div class="col">${c.map(t=>tile(t,w)).join('')}</div>`).join('');
}
function seg(id,fn){const el=document.getElementById(id);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset);render()}}
seg('segH',d=>H=d.h==='1');seg('segM',d=>{document.getElementById('phone').className='phone '+d.m});
const chip=(b,l)=>`<div class="chip"><div class="z">${b}</div><span class="l">${l}</span></div>`;
document.getElementById('cats').innerHTML=[['grail','Grail'],['watch','Watchlist'],['next','Next Cop'],['someday','Someday'],['gift','Gift']].map(([k,l])=>chip(`<div class="v-badge">${ic(k)}</div>`,l)).join('');
document.getElementById('prices').innerHTML=[[9,'einstellig'],[89,'zweistellig'],[249,'dreistellig'],[1249,'vierstellig']].map(([n,l])=>chip(priceBadge(n),l)).join('');
document.getElementById('waits').innerHTML=[[14,'neu'],[7,'halb'],[2,'≤ 3 Tage'],[0,'vorbei']].map(([d,l])=>chip(waitBadge(d),l)).join('');
render();addEventListener('resize',render);
</script>
</body>
</html>
