<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valet – Freistell-Test (BiRefNet Lite)</title>
<style>
  :root { --bg:#F5F0E8; --ink:#2A1A1D; --muted:#6E5E60; --line:#2A1A1D1F; --ox:#722638; --or:#FF641F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17110F; --ink:#F5F0E8; --muted:#A8999A; --line:#F5F0E826; --ox:#E8899F; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:max(16px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-family: Georgia, serif; font-weight:400; color:var(--ox); font-size:30px; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:14px; margin:12px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label.opt { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:15px; }
  button, .file { font:600 16px system-ui; border:0; border-radius:12px; padding:12px 16px; cursor:pointer; }
  .primary { background:var(--ox); color:#fff; }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .file { background:var(--or); color:#2A1A1D; display:inline-block; }
  button:disabled { opacity:.4; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; width:0; background:var(--or); transition:width .2s; }
  #log { font:13px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; color:var(--muted); margin:0; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; }
  .stats b { display:block; font:400 22px Georgia, serif; }
  .stats span { font-size:12px; color:var(--muted); }
  .view { border-radius:16px; overflow:hidden; background:var(--b, repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/20px 20px); }
  .view img { display:block; width:100%; }
  .bgs button { padding:6px 12px; font-size:14px; border-radius:999px; }
</style>
</head>
<body>
<main>
  <h1>Freistell-Test</h1>
  <p class="sub">BiRefNet Lite direkt auf deinem Gerät, über den Grafikchip (WebGPU). Das Modell wird einmal geladen und im Browser gespeichert; deine Fotos verlassen das Gerät nicht.</p>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <strong style="width:100%">Rechnen auf</strong>
      <label class="opt"><input type="radio" name="dev" value="webgpu" checked> Grafikchip (WebGPU)</label>
      <label class="opt"><input type="radio" name="dev" value="wasm"> Prozessor</label>
    </div>
    <div class="row">
      <strong style="width:100%">Genauigkeit</strong>
      <label class="opt"><input type="radio" name="dt" value="fp16" checked> halb · 115 MB</label>
      <label class="opt"><input type="radio" name="dt" value="fp32"> voll · 224 MB</label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="load" class="primary">Modell laden</button>
      <label class="file">Foto wählen<input id="pick" type="file" accept="image/*" hidden></label>
      <button id="again" class="secondary" disabled>Nochmal rechnen</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="card stats">
    <div><b id="sLoad">–</b><span>Modell laden</span></div>
    <div><b id="sRun">–</b><span>Freistellen</span></div>
    <div><b id="sDev">–</b><span>Gerät</span></div>
  </div>

  <div id="out" hidden>
    <div class="row bgs" style="margin:8px 0">
      <button class="secondary" data-b="repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px">Karo</button>
      <button class="secondary" data-b="#2A1A1D">Dunkel</button>
      <button class="secondary" data-b="#F5F0E8">Elfenbein</button>
      <button class="secondary" data-b="#FF641F">Orange</button>
      <a id="dl" class="secondary" style="padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px" download="freigestellt.png">Speichern</a>
    </div>
    <div class="view" id="view"><img id="res" alt="Freigestelltes Bild"></div>
  </div>

  <div class="card"><pre id="log"></pre></div>
</main>

<script type="module">
import { AutoModel, AutoProcessor, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1';

env.allowLocalModels = false;
env.useBrowserCache = true; // Modell bleibt im Browser gespeichert

const MODEL = 'onnx-community/BiRefNet_lite-ONNX';
const $ = (id) => document.getElementById(id);
const log = (t) => { $('log').textContent += t + '\n'; };
const sec = (ms) => (ms / 1000).toFixed(1) + ' s';
let model = null, processor = null, lastFile = null, loadedWith = '';

log('WebGPU vorhanden: ' + (!!navigator.gpu ? 'ja' : 'nein'));
if (navigator.gpu) {
  navigator.gpu.requestAdapter().then((a) => {
    if (!a) return log('WebGPU: kein Grafikchip freigegeben');
    log('Grafikchip: ' + [a.info?.vendor, a.info?.architecture, a.info?.description].filter(Boolean).join(' · ') + ' | fp16: ' + (a.features.has('shader-f16') ? 'ja' : 'nein'));
  }).catch((e) => log('WebGPU-Fehler: ' + e.message));
} else {
  document.querySelector('input[value=wasm]').checked = true;
}

async function loadModel() {
  const device = document.querySelector('input[name=dev]:checked').value;
  const dtype = document.querySelector('input[name=dt]:checked').value;
  const key = device + '/' + dtype;
  if (model && loadedWith === key) return;
  $('load').disabled = true; $('sDev').textContent = device === 'webgpu' ? 'GPU' : 'CPU';
  const files = {};
  const t0 = performance.now();
  log(`Lade ${MODEL} (${dtype}) für ${device} …`);
  try {
    processor ??= await AutoProcessor.from_pretrained(MODEL);
    model = await AutoModel.from_pretrained(MODEL, {
      device, dtype,
      progress_callback: (p) => {
        if (p.status === 'progress' && p.total) {
          files[p.file] = [p.loaded, p.total];
          const [l, t] = Object.values(files).reduce((a, [x, y]) => [a[0] + x, a[1] + y], [0, 0]);
          $('prog').style.width = (100 * l / t).toFixed(0) + '%';
        }
      },
    });
    loadedWith = key;
    const ms = performance.now() - t0;
    $('sLoad').textContent = sec(ms); $('prog').style.width = '100%';
    log(`Modell bereit nach ${sec(ms)} (beim zweiten Mal kommt es aus dem Browser-Speicher).`);
  } catch (e) {
    log('FEHLER beim Laden: ' + (e?.message ?? e)); model = null;
  } finally { $('load').disabled = false; }
}

async function run(file) {
  if (!file) return;
  lastFile = file;
  await loadModel();
  if (!model) return;
  $('again').disabled = true;
  try {
    const url = URL.createObjectURL(file);
    const image = await RawImage.fromURL(url);
    log(`Foto: ${image.width} × ${image.height} px`);
    const t0 = performance.now();
    const { pixel_values } = await processor(image);
    log(`Rechengröße: ${pixel_values.dims.slice(2).join(' × ')}`);
    const { output_image } = await model({ input_image: pixel_values });
    const maskT = output_image[0].sigmoid().mul(255).to('uint8');
    const mask = await RawImage.fromTensor(maskT).resize(image.width, image.height);
    const ms = performance.now() - t0;
    $('sRun').textContent = sec(ms);
    log(`Freigestellt in ${sec(ms)}`);

    // Maske als Transparenz anwenden und eng zuschneiden
    const c = document.createElement('canvas'); c.width = image.width; c.height = image.height;
    const ctx = c.getContext('2d');
    const img = new Image(); img.src = url; await img.decode();
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, c.width, c.height);
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let i = 0, p = 0; i < mask.data.length; i++, p += 4) {
      const a = mask.data[i]; px.data[p + 3] = a;
      if (a > 5) { const x = i % c.width, y = (i / c.width) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    ctx.putImageData(px, 0, 0);
    const out = document.createElement('canvas'); out.width = Math.max(1, x1 - x0 + 1); out.height = Math.max(1, y1 - y0 + 1);
    out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    const png = out.toDataURL('image/png');
    $('res').src = png; $('dl').href = png; $('out').hidden = false;
  } catch (e) {
    log('FEHLER beim Freistellen: ' + (e?.message ?? e));
  } finally { $('again').disabled = false; }
}

$('load').onclick = loadModel;
$('pick').onchange = (e) => run(e.target.files[0]);
$('again').onclick = () => run(lastFile);
document.querySelectorAll('input[name=dev], input[name=dt]').forEach((r) => (r.onchange = () => { model = null; loadedWith = ''; }));
document.querySelectorAll('.bgs button').forEach((b) => (b.onclick = () => $('view').style.setProperty('--b', b.dataset.b)));
</script>
</body>
</html>
